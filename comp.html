<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenges</title>
</head>

<body>
    <nav class="navbar">
        <div class="conttainer">
            <a class="" href="index.html">NatureNest</a>
        </div>
    </nav>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .navbar {
            background: linear-gradient(to right, #054215, #8dea61);
            color: white;
            padding: 15px;
        }

        .navbar a {
            color: rgb(221, 230, 226);
            text-decoration: none;
            padding: 10px;
        }

        .navbar a.active {
            background-color: #555;
        }
    </style>
    <div class="container">
        <h1>🌱 Gardening Challenges</h1>
        <ul id="challenge-list">
            <!-- Challenges will be added by JS -->
        </ul>
        <div class="rewards">
            <p>Points: <span id="points">0</span></p>
            <p>Badges: <span id="badges">None</span></p>
        </div>
    </div>
   

    <style>
        .container {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            width: 400px;
            margin: 2rem;
            margin-left: 35rem;
        }

        h1 {
            text-align: center;
            color: #2e7d32;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            margin: 1rem 0;
            padding: 1rem;
            background: #e8f5e9;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        button {
            padding: 0.5rem 1rem;
            border: none;
            background: #43a047;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        button:disabled {
            background: #c8e6c9;
            cursor: not-allowed;
        }

        .rewards {
            margin-top: 2rem;
            text-align: center;
            font-size: 1.2rem;
        }
    </style>
    <script>
        const challenges = [
            { id: 1, text: 'Water your plants', points: 10 },
            { id: 2, text: 'Weed the garden', points: 15 },
            { id: 3, text: 'Compost kitchen waste', points: 20 },
            { id: 4, text: 'Plant a new herb', points: 25 },
            { id: 5, text: 'Join a garden cleanup event', points: 30 }
        ];

        let totalPoints = 0;
        let badges = [];

        const challengeList = document.getElementById('challenge-list');
        const pointsDisplay = document.getElementById('points');
        const badgesDisplay = document.getElementById('badges');

        function updateRewards() {
            pointsDisplay.textContent = totalPoints;

            if (totalPoints >= 100 && !badges.includes("🌟 Master Gardener")) {
                badges.push("🌟 Master Gardener");
            } else if (totalPoints >= 50 && !badges.includes("🌼 Green Thumb")) {
                badges.push("🌼 Green Thumb");
            }

            badgesDisplay.textContent = badges.length > 0 ? badges.join(', ') : 'None';
        }

        function createChallengeItem(challenge) {
            const li = document.createElement('li');
            li.innerHTML = `
    <span>${challenge.text}</span>
    <button onclick="completeChallenge(${challenge.id}, this)">Complete</button>
  `;
            challengeList.appendChild(li);
        }

        function completeChallenge(id, button) {
            const challenge = challenges.find(c => c.id === id);
            if (challenge) {
                totalPoints += challenge.points;
                updateRewards();
                button.disabled = true;
                button.textContent = 'Completed';
            }
        }

        // Initialize
        challenges.forEach(createChallengeItem);


    </script>
</body>

</html>
