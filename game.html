<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games</title>
</head>

<body>
    <nav class="navbar">
        <div class="conttainer">
            <a class="" href="index.html">NatureNest</a>
        </div>
    </nav>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .navbar {
            background: linear-gradient(to right, #054215, #8dea61);
            color: white;
            padding: 15px;
        }

        .navbar a {
            color: rgb(221, 230, 226);
            text-decoration: none;
            padding: 10px;
        }

        .navbar a.active {
            background-color: #555;
        }
    </style>
    <section class="sell-section">
        <h2 >garden game zone</h2>
        <div class="sell-container">
            <div class="sell-item">
                <img src="images/vecteezy_beautiful-vintage-green-thumb-holding-plant-isolated-original_57439667.png"
                    alt="Some Fun">
                <h3>Catch the plant</h3>
                <a href="fun.html" class="explore-btn">Play Now</a>
            </div>
            
            <div class="sell-item">
                <img src="images/vecteezy_stunning-traditional-neurotechnology-abstract-art-green-hues_58049315.png" alt="Some Fun">
                <h3>Garden Memory Match</h3>
                <a href="mem.html" class="explore-btn">Play Now</a>
            </div>
    </section>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');



        .sell-section {
            max-width: 1200px;
            margin: 50px auto;
            text-align: center;
            padding: 20px;
        }

        .sell-section h2 {
            font-size: 2.0rem;
            color: #0c4a0d;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .sell-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            justify-content: center;
            padding: 20px;
        }

        .sell-item {
            background: rgb(222, 248, 221);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: transform 0.3s ease-in-out;
        }

        .sell-item:hover {
            transform: scale(1.05);
        }

        .sell-item img {
            width: 40%;
            height: 190px;
            border-radius: 8px;
            object-fit: cover;
        }

        .sell-item h3 {
            margin: 10px 0;
            font-size: 1.5rem;
            color: #2c3e50;
        }

        .explore-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 20px;
            background: #155824;
            color: rgb(247, 240, 240);
            font-size: 1rem;
            font-weight: 500;
            text-decoration: none;
            border-radius: 5px;
            transition: all 0.3s ease-in-out;
        }

        .explore-btn:hover {
            background: #1cc34c;
            transform: scale(1.1);
        }
    </style>
</body>

</html>
